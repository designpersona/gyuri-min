<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#A3E03B" />

  <title>Design Persona — Portfolio</title>
  <script>
    (function () {
      var route = (window.location.hash || '#/').replace(/^#\/?/, '').toLowerCase();
      if (!route) return;

      var knownRoutes = [
        'about',
        'archive',
        'rebuilders',
        'chatlog',
        'gm-portfolio',
        'farmsplan-deli-cafe',
        'openfarm',
        '27-red-brick',
        'farmsplan-swine-feed',
        'aid-rebranding',
        'cafe-terrabite',
        'record-of-sea-salt',
        'farmsplan-cattle-feed',
        'farmsplan-chicken',
        'fp-brand-film',
        'fp-brand-identity',
        'gullyjumper-universe',
        'deep-dive-campaign',
        'fresh-chungnam',
        'siso-fair-2020',
        'news-letter',
        'chabssal-tteogkki',
        'eye-makeup',
        'portfolio-access-denied',
        'portfolio-link-invalid',
        'portfolio-link-inactive',
        'portfolio-link-error'
      ];
      var categoryRoutes = [
        'brand-systems',
        'fnb-retail',
        'packaging',
        'campaign-content',
        'digital-web',
        'illustration-character'
      ];
      var isKnownCategory = route.indexOf('category/') === 0 && categoryRoutes.indexOf(route.slice(9)) !== -1;

      if (knownRoutes.indexOf(route) === -1 && !isKnownCategory) {
        document.documentElement.style.visibility = 'hidden';
        window.location.replace('/404.html');
      }
    })();
  </script>
  <meta name="description" content="Selected branding and project work by Design Persona. A new site is taking shape." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Design Persona — Portfolio" />
  <meta property="og:description" content="Selected branding and project work by Design Persona. A new site is taking shape." />
  <link rel="icon" href="./assets/icons/favicon2.png" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Microsoft Clarity: 기존 프로젝트를 유지해 공사중 모드 전후의 행동을 비교한다. -->
  <script>
    (function(c,l,a,r,i,t,y){
      c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
      y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "unahd0ky9n");
  </script>

  <style>
    :root {
      color-scheme: light;
      --ink: #111111;
      --paper: #ffffff;
      --accent: #A3E03B;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Outfit", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a { color: inherit; }

    .page {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    .topbar,
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 20px clamp(20px, 4vw, 64px);
    }

    .topbar { border-bottom: 1px solid var(--ink); }
    .footer { border-top: 1px solid var(--ink); }

    .brand {
      display: inline-flex;
      align-items: center;
      font-size: clamp(18px, 1.6vw, 22px);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .status::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      content: "";
      animation: pulse 1.8s ease-in-out infinite;
    }

    .main {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(280px, 0.8fr);
      min-height: 0;
    }

    .message {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 48px;
      padding: clamp(36px, 6vw, 96px) clamp(20px, 4vw, 64px);
    }

    .eyebrow {
      margin: 0 0 18px;
      font-size: clamp(12px, 1vw, 14px);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 1040px;
      margin: 0;
      font-size: clamp(66px, 11.5vw, 180px);
      font-weight: 400;
      letter-spacing: -0.065em;
      line-height: 0.82;
    }

    h1 span {
      color: var(--ink);
      font-weight: 700;
    }

    .summary {
      max-width: 620px;
      margin: 0;
      font-size: clamp(18px, 2vw, 28px);
      line-height: 1.35;
      letter-spacing: -0.025em;
      text-wrap: balance;
    }

    .contact-panel {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: clamp(36px, 6vw, 96px) clamp(28px, 4vw, 64px);
      background: var(--accent);
      border-left: 1px solid var(--ink);
    }

    .contact-label {
      margin: 0 0 auto;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .contact-copy {
      margin: 0 0 28px;
      font-size: clamp(22px, 2.8vw, 40px);
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: -0.04em;
      text-wrap: balance;
    }

    .contact-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 62px;
      padding: 17px 0;
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      font-size: clamp(15px, 1.5vw, 19px);
      font-weight: 600;
      text-decoration: none;
    }

    .contact-link + .contact-link { border-top: 0; }

    .contact-link svg {
      width: 22px;
      height: 22px;
      transition: transform 180ms ease;
    }

    .contact-link:hover svg,
    .contact-link:focus-visible svg { transform: translate(4px, -4px); }

    .contact-link:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 5px;
    }

    .footer {
      justify-content: center;
      background: var(--ink);
      color: #b3b3b3;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .footer p { margin: 0; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.38; transform: scale(0.78); }
    }

    @media (max-width: 760px) {
      .page { min-height: 100dvh; }
      .topbar { padding-block: 16px; }
      .main { grid-template-columns: 1fr; }
      .message { min-height: 58svh; }
      h1 { font-size: clamp(66px, 21vw, 104px); }
      .contact-panel {
        min-height: 42svh;
        border-top: 1px solid var(--ink);
        border-left: 0;
      }
      .contact-label { margin-bottom: 72px; }
      .footer { align-items: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      .status::before { animation: none; }
      .contact-link svg { transition: none; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="topbar">
      <div class="brand" aria-label="Design Persona">
        <span>Design Persona</span>
      </div>
      <div class="status">Coming soon</div>
    </header>

    <main class="main">
      <section class="message" aria-labelledby="pageTitle">
        <div>
          <p class="eyebrow">Branding / Projects</p>
          <h1 id="pageTitle">Under<br /><span>rebuild.</span></h1>
        </div>
        <p class="summary">
          A new home for selected branding<br />
          and project work is taking shape.
        </p>
      </section>

      <aside class="contact-panel" aria-labelledby="contactTitle">
        <p class="contact-label">Collaboration / Business</p>
        <p class="contact-copy" id="contactTitle">
          For collaborations and business inquiries, get in touch by email or chat.
        </p>
        <a class="contact-link" id="emailInquiry" href="mailto:designpersona.kr@gmail.com">
          <span>Email</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 19 19 5M9 5h10v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
        <a class="contact-link" id="chatInquiry" href="https://example.com/designpersona-chat" target="_blank" rel="noopener noreferrer">
          <span>Chat</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 19 19 5M9 5h10v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
      </aside>
    </main>

    <footer class="footer">
      <p>© 2026 Gyuri Min. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var hashRoute = (window.location.hash || "#/").replace(/^#\/?/, "") || "home";
      var referrerHost = "direct";

      try {
        if (document.referrer) referrerHost = new URL(document.referrer).hostname || "referral";
      } catch (error) {
        referrerHost = "referral";
      }

      var source = params.get("utm_source") || params.get("ref") || params.get("from") || referrerHost;
      var medium = params.get("utm_medium") || (source === "direct" ? "none" : "referral");
      var campaign = params.get("utm_campaign") || "portfolio_lock";
      var content = params.get("utm_content") || hashRoute;

      var safe = function (value) {
        return String(value || "unknown").slice(0, 120);
      };

      window.clarity("set", "site_mode", "construction");
      window.clarity("set", "entry_source", safe(source));
      window.clarity("set", "entry_medium", safe(medium));
      window.clarity("set", "entry_campaign", safe(campaign));
      window.clarity("set", "entry_content", safe(content));
      window.clarity("set", "invite_id", safe(params.get("invite_id") || "none"));
      window.clarity("set", "entry_route", safe(hashRoute));
      window.clarity("set", "portfolio_access", params.get("access") === "denied" ? "denied" : "construction");
      window.clarity("event", "construction_view");

      [5, 15, 30].forEach(function (seconds) {
        window.setTimeout(function () {
          window.clarity("event", "stay_" + String(seconds).padStart(2, "0") + "s");
        }, seconds * 1000);
      });

      var email = document.getElementById("emailInquiry");
      var subject = "[Design Persona] Collaboration / Business inquiry";
      var body = [
        "Hello Design Persona,",
        "",
        "I would like to discuss:",
        "",
        "---",
        "Entry reference: " + safe(source) + " / " + safe(content)
      ].join("\n");

      email.href = "mailto:designpersona.kr@gmail.com?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
      email.addEventListener("click", function () {
        window.clarity("event", "email_inquiry_click");
      });

      var chat = document.getElementById("chatInquiry");
      chat.addEventListener("click", function () {
        window.clarity("event", "chat_inquiry_click");
      });
    })();
  </script>
</body>
</html>
